aid: gambit
name: Gambit
description: 'Gambit Security is an Israeli cyber-resilience company, founded in 2024 by Unit 8200
  veterans Alon Gromakov (CEO), Sa''ar Elias (CPO) and May Kogan (CTO), that emerged from stealth in
  February 2026 with $61M in seed and Series A funding from Cyberstarts, Kleiner Perkins and Spark
  Capital. Its product, Balens, is an AI-native autonomous resilience platform that continuously maps
  every resource in an environment into end-to-end business applications, revealing dependencies,
  backup coverage and immutability, detecting infrastructure drift, scoring Cyber Resilience Posture
  Management (CRPM) and validating real-world recovery paths against ransomware and outages. It also
  automates compliance evidence for frameworks such as DORA, NIST CSF and SOX. Gambit does not
  currently publish a public developer API, OpenAPI, or developer portal.'
